[package]
name = "mouse-studio"
version = "0.1.0"
edition = "2024"
description = "A personal MX Anywhere 3S settings interface for Arch Linux"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.33.3", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tempfile = "3"
evdev = "0.13.2"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
